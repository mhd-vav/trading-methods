name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # --- Python: analysis-api ---
  analysis-api-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/analysis-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/analysis-api/requirements.txt
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check app/
      - name: Format check
        run: ruff format --check app/
      - name: Type check
        run: python -m mypy app/ || true
      - name: Unit + API tests
        run: pytest tests/ -q
      - name: Compile check
        run: python -m compileall -q app/

  # --- Secret scan ---
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Dependency scan ---
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # --- Container images (build + tag with git SHA) ---
  container-analysis-api:
    runs-on: ubuntu-latest
    needs: [analysis-api-python, secrets]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build analysis-api image (tagged with SHA)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services/analysis-api
          file: services/analysis-api/Dockerfile
          target: runtime
          push: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/analysis-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/analysis-api:latest
      - name: Confirm runtime image boots
        run: |
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository_owner }}/analysis-api-test:${{ github.sha }} \
            -c "print('image-boot-ok')" || true

  # --- Web (starts when apps/web is imported) ---
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    if: ${{ hashFiles('apps/web/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build

  # --- C++ engine (starts when packages/market-profile-core is imported) ---
  cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/market-profile-core
    if: ${{ hashFiles('packages/market-profile-core/CMakeLists.txt') != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure