# OpenTelemetry Collector — receives traces/metrics from all services
# and exportss to stdout (dev) or a backend (prod: configure OTLP exporter)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Add service name as a resource attribute
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:APP_ENV:-development}
        action: upsert

exporters:
  # Dev: log to stdout
  debug:
    verbosity: basic

  # Prod: uncomment and configure your backend
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
